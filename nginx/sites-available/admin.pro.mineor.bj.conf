# Mineor Pro — admin back-office (oryx-frontend repo, Angular SPA, infra/compose.prod.yaml).
#
# Upstream: 127.0.0.1:3009 — `web` container (nginx-unprivileged serving the static build).
# The stack's default WEB_PORT is 8081; set WEB_PORT=3009 in infra/.env.production.
# Same file: API_URL=https://api.pro.mineor.bj/api (baked in at build time) and
# API_ORIGIN=https://api.pro.mineor.bj (CSP connect-src).
#
# CSP, X-Frame-Options, Permissions-Policy… are set by the container's nginx; only
# HSTS and TLS live here. Don't add add_header in a location below: it would stop the
# server-level HSTS from being inherited there.

server {
    listen 80;
    listen [::]:80;
    server_name admin.pro.mineor.bj;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.pro.mineor.bj;

    ssl_certificate /etc/letsencrypt/live/admin.pro.mineor.bj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.pro.mineor.bj/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/admin.pro.mineor.bj/chain.pem;

    # Mozilla intermediate (ECDHE only, no dhparam needed)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/admin.pro.mineor.bj.access.log;
    error_log  /var/log/nginx/admin.pro.mineor.bj.error.log warn;

    # Recommended once the office IPs are known: restrict the back-office.
    # allow 203.0.113.10;   # office
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
