# Mineor Pro — Laravel API (oryx-backend repo, infra/compose.prod.yaml).
#
# Upstream: 127.0.0.1:3008 — `app` container (Apache + PHP). The stack's default
# APP_PORT is 8000; set APP_PORT=3008 in infra/.env.production so it follows the
# 30xx numbering of this VPS. db and redis publish no port.
#
# Admin SPA (admin.pro.mineor.bj) calls this API from the browser: the backend must
# have FRONTEND_URL / CORS_ALLOWED_ORIGINS = https://admin.pro.mineor.bj.
#
# HSTS with includeSubDomains: only our hosts will ever live under *.api.pro.mineor.bj.

# Zones are http-level and global to nginx: names are prefixed to avoid clashes.
limit_req_zone $binary_remote_addr zone=mineor_pro_api:10m rate=20r/s;
# Auth / OTP endpoints: anti brute-force and SMS spam. 30/min per IP because mobile
# carriers share one IP between many customers. Laravel throttles per route as well.
limit_req_zone $binary_remote_addr zone=mineor_pro_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.pro.mineor.bj;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.pro.mineor.bj;

    ssl_certificate /etc/letsencrypt/live/api.pro.mineor.bj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pro.mineor.bj/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.pro.mineor.bj/chain.pem;

    # Mozilla intermediate (ECDHE only, no dhparam needed)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/api.pro.mineor.bj.access.log;
    error_log  /var/log/nginx/api.pro.mineor.bj.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # Matches post_max_size = 12M in infra/docker/app/php.ini.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: nginx is the edge, so a client-sent
    # X-Forwarded-For must not reach the API (Laravel throttles, audit log).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_read_timeout 90s;

    location ~ ^/api/auth/(login|request-code|verify-code|forgot-password|reset-password)$ {
        limit_req zone=mineor_pro_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3008;
    }

    # API docs (/docs/openapi.json, /docs/swagger) are not public in production.
    # Reach them through `ssh -L 3008:127.0.0.1:3008 root@217.160.9.92`.
    location ^~ /docs/ {
        return 404;
    }

    location / {
        limit_req zone=mineor_pro_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3008;
    }
}
