# MedUrgiaX — test server for the triage / telemedicine backend (FastAPI).
#
# One hostname, two upstreams:
#   * API (medurgiax-backend/deploy, 127.0.0.1:3004): /api/, the OpenAPI pages
#     and /healthz. The mobile app and the web app both talk JSON to /api/v1.
#   * Web app (medurgiax-frontend/deploy, 127.0.0.1:3005): everything else —
#     a static SPA, so the browser stays same-origin with the API (no CORS).
#
# Two things about this app shape the config below:
#
#   * It handles health data. This VPS is not HDS-certified, so it must only
#     ever see test accounts and fictitious patients. Nothing here changes that;
#     it is a rule for whoever creates the accounts.
#
#   * The OpenAPI pages (/docs, /redoc, /openapi.json) stay reachable because
#     this is a test server; a production host would close them.

server {
    listen 80;
    listen [::]:80;
    server_name medurgiax.k4yod3.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name medurgiax.k4yod3.com;

    ssl_certificate /etc/letsencrypt/live/medurgiax.k4yod3.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medurgiax.k4yod3.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/medurgiax.k4yod3.com/chain.pem;

    # Mozilla intermediate (ECDHE only, no dhparam needed)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # An API, not a site: nothing here belongs in a search index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript;

    # JSON bodies only (symptoms, messages); no file uploads through the API.
    # (Test APKs under /dl/ are downloads, not uploads.)
    client_max_body_size 1m;

    # Test builds of the mobile app, side-loaded on testers' phones. Files sit
    # under /var/www/medurgiax-dl/<random-token>/, so a link is only known to
    # whoever it was sent to; no listing, nothing indexed.
    location /dl/ {
        alias /var/www/medurgiax-dl/;
        autoindex off;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;

        # add_header here replaces the server-level set, so repeat it.
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Server-Sent Events (V2-REGUL): no buffering, keep-alive upstream, longer read timeout.
    location = /api/v1/events/stream {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 90s;
    }

    # EX-018 visio: LiveKit signalling (self-hosted, /srv/medurgiax-livekit) on
    # 127.0.0.1:7880, WebSocket. Clients use wss://medurgiax.k4yod3.com/livekit;
    # the prefix is stripped. Media goes direct (7881/tcp, 50000-50100/udp,
    # TURN 3478/udp), not through nginx. No recording.
    location /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # EX-077 PharmaSecure: prescription uploads (up to 3 files x 10 MB per
    # request, multipart overhead included). Everywhere else keeps the 1 MB default.
    location ^~ /api/v1/prescriptions {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
    }

    location ~ ^/(api/|docs|redoc|openapi\.json|healthz) {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: nginx is the edge, so a client-sent
        # X-Forwarded-For must not reach the API (audit IPs, per-IP rate limits).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
