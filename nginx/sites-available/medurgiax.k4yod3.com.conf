# MedUrgiaX — test server for the triage / telemedicine backend (FastAPI).
#
# Postgres + API run with Docker Compose from medurgiax-backend/deploy; the API
# is published on 127.0.0.1:3004. Clients are the MedUrgiaX mobile app and,
# later, the web app — both talk JSON to /api/v1.
#
# Two things about this app shape the config below:
#
#   * It handles health data. This VPS is not HDS-certified, so it must only
#     ever see test accounts and fictitious patients. Nothing here changes that;
#     it is a rule for whoever creates the accounts.
#
#   * The OpenAPI pages (/docs, /redoc, /openapi.json) stay reachable because
#     this is a test server; a production host would close them.

server {
    listen 80;
    listen [::]:80;
    server_name medurgiax.k4yod3.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name medurgiax.k4yod3.com;

    ssl_certificate /etc/letsencrypt/live/medurgiax.k4yod3.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medurgiax.k4yod3.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/medurgiax.k4yod3.com/chain.pem;

    # Mozilla intermediate (ECDHE only, no dhparam needed)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # An API, not a site: nothing here belongs in a search index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript;

    # JSON bodies only (symptoms, messages); no file uploads through the API.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
