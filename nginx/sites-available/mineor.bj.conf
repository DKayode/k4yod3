# Mineor Gaz — production domain of the API (bought 2026-11-12, DNS on the VPS 2026-11-13).
#
# Same stack and routing as mineor.k4yod3.com (nginx/snippets/mineor-app.conf); both
# hostnames stay live so already-installed apps keep working while they move to mineor.bj.
# Only the apex resolves for now (no www., no api.).
#
# HSTS without includeSubDomains: on an apex it would force HTTPS on every future
# *.mineor.bj host (mail provider, webmail…), which we don't control yet.

server {
    listen 80;
    listen [::]:80;
    server_name mineor.bj;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mineor.bj;

    ssl_certificate /etc/letsencrypt/live/mineor.bj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mineor.bj/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mineor.bj/chain.pem;

    # Mozilla intermediate (ECDHE only, no dhparam needed)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /root/k4yod3/nginx/snippets/mineor-app.conf;
}
