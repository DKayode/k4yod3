# Mineor Gaz — commande et livraison de gaz domestique (Bénin). Laravel API.
#
# Working domain until mineor.bj is wired in (GAZ-117). One hostname, two
# upstreams, both from the mineor-gaz stack (DKayode/mineor-gaz):
#   * API (127.0.0.1:3006): the stack's own nginx in front of PHP-FPM. Serves
#     /api/v1 (mobile apps, back-office, payment-provider webhooks) and the
#     public pages Google Play requires (account / data deletion, privacy
#     policy — GAZ-206).
#   * Reverb (127.0.0.1:3007): WebSockets for live order tracking (GAZ-160).
#     Clients connect to wss://mineor.k4yod3.com/app/<REVERB_APP_KEY>, port 443.
#     Laravel publishes events to Reverb inside the stack, so its HTTP API
#     (/apps/...) is never exposed here.
#
# Things about this app that shape the config below:
#
#   * Riders and customers are on Beninese mobile connections: gzip on JSON.
#
#   * Uploads (rider documents, cylinder photos) go through the API, up to the
#     20 MB the PHP image allows (upload_max_filesize / post_max_size).
#
#   * Horizon (/horizon) is the queue dashboard. It is gated to admins in the
#     app, but there is no reason to reach it from outside the VPS: use an SSH
#     tunnel (ssh -L 3006:127.0.0.1:3006 root@217.160.9.92).

server {
    listen 80;
    listen [::]:80;
    server_name mineor.k4yod3.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mineor.k4yod3.com;

    ssl_certificate /etc/letsencrypt/live/mineor.k4yod3.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mineor.k4yod3.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mineor.k4yod3.com/chain.pem;

    # Mozilla intermediate (ECDHE only, no dhparam needed)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # Matches upload_max_filesize / post_max_size in infra/docker/php/php.ini.
    client_max_body_size 20m;

    # Reverb (Pusher protocol): WebSocket upgrade, long-lived connections.
    location /app/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Queue dashboard: loopback only (see header).
    location ^~ /horizon {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: nginx is the edge, so a client-sent
        # X-Forwarded-For must not reach the API (rate limits, audit log).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Uploads over slow mobile links; buffer them here, not in PHP-FPM.
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
