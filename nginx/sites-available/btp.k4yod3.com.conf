# ChantierPro — gestion de chantier BTP (Bénin).
#
# Next.js 15 server-rendered app in a container on 127.0.0.1:3003. Supabase is
# reached directly by the browser and by the mobile app, not through this proxy,
# so nothing here needs to know about it.
#
# Two things about this app shape the config below:
#
#   * Its readers are on Beninese and West-African-diaspora mobile connections.
#     Compression and long static caching are not micro-optimisations here; they
#     are the difference between a report opening and a reader giving up.
#
#   * The weekly report is published behind an unguessable token at /r/<token>,
#     handed out over WhatsApp. Those URLs must never end up in a search index.

server {
    listen 80;
    listen [::]:80;
    server_name btp.k4yod3.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name btp.k4yod3.com;

    ssl_certificate /etc/letsencrypt/live/btp.k4yod3.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/btp.k4yod3.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/btp.k4yod3.com/chain.pem;

    # Mozilla intermediate (ECDHE only, no dhparam needed)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # The app takes no file uploads: site photos go from the phone straight to
    # Supabase Storage. This only has to fit a form post.
    client_max_body_size 2m;

    # Next.js fingerprints these filenames, so they can be cached for a year.
    # A foreman's phone then re-fetches only the HTML on each visit.
    #
    # Browser caching only — there is no proxy_cache zone here, and declaring
    # proxy_cache_valid without one would do nothing while implying otherwise.
    # The origin is a container on loopback; the round trip worth removing is
    # the one over the mobile network, not the one to localhost.
    #
    # An add_header anywhere in a block replaces the whole inherited set rather
    # than adding to it, so the server-level headers are repeated here.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Shared weekly reports. The page already sets a noindex meta tag; this says
    # the same thing in a header, which is what a crawler following a link
    # forwarded into a public WhatsApp group actually obeys.
    location /r/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Repeating the server-level headers: the X-Robots-Tag below would
        # otherwise replace them for this location rather than join them.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # A report renders a month of movements and can emit a PDF.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The weekly cron endpoint. Authenticated by a bearer secret in the app, but
    # there is no reason for it to be reachable from outside the VPS at all.
    location = /api/jobs/rapport-hebdo {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # It builds a report per active site and sends each one; the app itself
        # allows up to 300s.
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Server-rendered pages fold a site's whole movement ledger, and the PDF
        # routes render a document. The default 60s is too tight for both.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
