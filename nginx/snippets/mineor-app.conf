# Mineor Gaz — shared by every hostname of the API (mineor.k4yod3.com, mineor.bj).
# Included from the 443 server block of each site; TLS, server_name and security
# headers stay in the site file (HSTS differs between a subdomain and an apex).
# Upstreams (mineor-gaz repo, infra/compose.prod.yaml):
#   127.0.0.1:3006  stack nginx + PHP-FPM (API, public pages, /docs/)
#   127.0.0.1:3007  Laravel Reverb (WebSockets, /app/)

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types application/json text/plain text/css application/javascript image/svg+xml;

# Matches upload_max_filesize / post_max_size in infra/docker/php/php.ini.
client_max_body_size 20m;

# Reverb (Pusher protocol): WebSocket upgrade, long-lived connections.
location /app/ {
    proxy_pass http://127.0.0.1:3007;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Queue dashboard: loopback only (see header).
location ^~ /horizon {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:3006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location / {
    proxy_pass http://127.0.0.1:3006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: nginx is the edge, so a client-sent
    # X-Forwarded-For must not reach the API (rate limits, audit log).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    # Uploads over slow mobile links; buffer them here, not in PHP-FPM.
    proxy_request_buffering on;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
